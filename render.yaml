services:
  - type: web
    name: unified-test-orchestration
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /
    autoDeploy: true
    envVars:
      - key: PORT
        value: 10000
      - key: API_BASE_URL
        value: http://127.0.0.1:8001
      - key: UI_BASE_URL
        value: http://127.0.0.1:8001
